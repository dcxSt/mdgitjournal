[package]
name = "mdgj-github"
description = "GitHub device flow, token refresh, token storage and REST calls for mdgitjournal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Keychain on macOS/iOS; Secret Service over D-Bus (system libdbus) on Linux.
keyring = { version = "3.6.3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
# rustls with ring instead of reqwest's default aws-lc-rs: ring needs only a C compiler on every
# target. Install it before building a client: `rustls::crypto::ring::default_provider().install_default()`.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[lints]
workspace = true
