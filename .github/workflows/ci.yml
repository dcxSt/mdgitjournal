name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal -c clippy -c rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      # --locked, like the AUR package: a stale Cargo.lock fails here, not after a release.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # End-to-end tests against github.com are #[ignore]d, so this stays offline.
      - run: cargo test --workspace --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pnpm -C app install --frozen-lockfile
      - run: pnpm -C app check
      - run: pnpm -C app test
      - run: pnpm -C app build
      - run: pnpm -C app exec playwright install --with-deps webkit
      - run: pnpm -C app e2e

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pnpm -C app install --frozen-lockfile
      - run: cargo fetch --locked
      # Fails when a dependency changed but packaging/THIRD-PARTY-NOTICES.md wasn't regenerated.
      - run: packaging/notices/generate.sh && git diff --exit-code packaging/THIRD-PARTY-NOTICES.md

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: the packages need at least the glibc they were built
          # with, so it only changes on purpose. Keep equal to the Linux runner in release.yml.
          - os: ubuntu-24.04
            artifacts: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          # The .app ships inside the .dmg; upload-artifact would drop its executable bits.
          - os: macos-latest
            artifacts: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config librsvg2-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pnpm -C app install --frozen-lockfile
      # Ad-hoc signed ("-"): left unsigned, the .app has only the linker's signature, which
      # doesn't seal Info.plist or the resources, and Gatekeeper calls a download "damaged".
      - name: Build bundles
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm -C app tauri build -- --locked
      - name: Check the app's signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 target/release/bundle/macos/mdgitjournal.app
      # E.g. a per-platform schema that tauri-build writes into the committed gen/schemas.
      - name: Check the build left no new or changed files
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdgitjournal-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  ios-sim:
    name: iOS Simulator
    needs: [rust, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
          cache: true
          cache_dependency_path: app/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pnpm -C app install --frozen-lockfile
      # From app/src-tauri/project.ios.yml (bundle.iOS.template), which links libz and libiconv
      # for the vendored libgit2.
      - name: Generate the Xcode project
        if: hashFiles('app/src-tauri/gen/apple/project.yml') == ''
        run: pnpm -C app tauri ios init --ci
      - run: pnpm -C app tauri ios build --target aarch64-sim --debug --no-sign
