name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the tag matches the app version
        run: |
          want="${GITHUB_REF_NAME#v}"
          check() { [ "$2" = "$want" ] || { echo "::error file=$1::version $2 does not match tag $GITHUB_REF_NAME"; exit 1; }; }
          check app/src-tauri/tauri.conf.json "$(jq -r .version app/src-tauri/tauri.conf.json)"
          check app/package.json "$(jq -r .version app/package.json)"
          check Cargo.toml "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mdgitjournal").version')"
          # Fails if RELEASING.md's `cargo update --workspace` was forgotten; the AUR package
          # builds the tag with --locked.
          cargo update --workspace --locked
          metainfo=packaging/linux/xyz.stephenfay.mdgitjournal.metainfo.xml
          grep -q "<release version=\"$want\"" "$metainfo" ||
            { echo "::error file=$metainfo::no <release> entry for $want"; exit 1; }
      - name: Warn about a missing GitHub App client ID
        env:
          CLIENT_ID: ${{ vars.MDGJ_GITHUB_CLIENT_ID || secrets.MDGJ_GITHUB_CLIENT_ID }}
        run: |
          [ -n "$CLIENT_ID" ] || grep -q '^MDGJ_GITHUB_CLIENT_ID' .cargo/config.toml ||
            echo "::warning::No GitHub App client ID is set; this release can only sign in with personal access tokens"
      # One draft up front, so the build jobs upload to it instead of racing to create it.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "mdgitjournal $GITHUB_REF_NAME"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin -- --locked
          # Pinned, not ubuntu-latest: the packages need at least the glibc they were built
          # with (2.39), so it only changes on purpose. Move on to the next LTS when GitHub
          # deprecates this image, and keep equal to the bundle job in ci.yml.
          - name: Linux x86_64
            os: ubuntu-24.04
            args: -- --locked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config librsvg2-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Add the macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # No rust-cache here: releases are rare, and every third-party step in this job can read
      # the Apple secrets.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pnpm -C app install --frozen-lockfile
      # Unset secrets and variables arrive as empty strings, which still count as set. Export only
      # the non-empty ones: without a client ID variable the one in .cargo/config.toml (if any)
      # applies. Without a certificate the app is ad-hoc signed ("-") and not notarized; left
      # unsigned, its bundle signature is broken and Gatekeeper calls a download "damaged".
      - name: Export build settings
        env:
          MDGJ_GITHUB_CLIENT_ID: ${{ vars.MDGJ_GITHUB_CLIENT_ID || secrets.MDGJ_GITHUB_CLIENT_ID }}
          MDGJ_GITHUB_APP_SLUG: ${{ vars.MDGJ_GITHUB_APP_SLUG }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names="MDGJ_GITHUB_CLIENT_ID MDGJ_GITHUB_APP_SLUG"
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_CERTIFICATE" ]; then
            names="$names APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          elif [ "$RUNNER_OS" = macOS ]; then
            echo "::warning::No Apple certificate is set; the .dmg is ad-hoc signed and not notarized"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
          for name in $names; do
            [ -n "${!name}" ] || continue
            { echo "$name<<__END__"; printf '%s\n' "${!name}"; echo "__END__"; } >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
      # An unsigned bundle (only the linker's signature) fails this, and Gatekeeper rejects it.
      - name: Check the app's signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 target/universal-apple-darwin/release/bundle/macos/mdgitjournal.app
