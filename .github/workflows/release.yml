name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the app version
        run: |
          want="${GITHUB_REF_NAME#v}"
          check() { [ "$2" = "$want" ] || { echo "::error file=$1::version $2 does not match tag $GITHUB_REF_NAME"; exit 1; }; }
          check app/src-tauri/tauri.conf.json "$(jq -r .version app/src-tauri/tauri.conf.json)"
          check app/package.json "$(jq -r .version app/package.json)"
          check Cargo.toml "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mdgitjournal").version')"
          metainfo=packaging/linux/xyz.stephenfay.mdgitjournal.metainfo.xml
          grep -q "<release version=\"$want\"" "$metainfo" ||
            { echo "::error file=$metainfo::no <release> entry for $want"; exit 1; }
      - name: Warn about a missing GitHub App client ID
        env:
          CLIENT_ID: ${{ vars.MDGJ_GITHUB_CLIENT_ID || secrets.MDGJ_GITHUB_CLIENT_ID }}
        run: |
          [ -n "$CLIENT_ID" ] || grep -q '^MDGJ_GITHUB_CLIENT_ID' .cargo/config.toml ||
            echo "::warning::No GitHub App client ID is set; this release can only sign in with personal access tokens"
      # One draft up front, so the build jobs upload to it instead of racing to create it.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "mdgitjournal $GITHUB_REF_NAME"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
          # Older glibc than ubuntu-latest, so the packages run on more distributions.
          - name: Linux x86_64
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev pkg-config librsvg2-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Add the macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: pnpm -C app install --frozen-lockfile
      # Unset secrets and variables arrive as empty strings, which still count as set. Export only
      # the non-empty ones: without Apple credentials the .dmg stays unsigned instead of failing,
      # and without a client ID variable the one in .cargo/config.toml (if any) applies.
      - name: Export build settings
        env:
          MDGJ_GITHUB_CLIENT_ID: ${{ vars.MDGJ_GITHUB_CLIENT_ID || secrets.MDGJ_GITHUB_CLIENT_ID }}
          MDGJ_GITHUB_APP_SLUG: ${{ vars.MDGJ_GITHUB_APP_SLUG }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names="MDGJ_GITHUB_CLIENT_ID MDGJ_GITHUB_APP_SLUG"
          if [ "$RUNNER_OS" = macOS ]; then
            names="$names APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          fi
          for name in $names; do
            [ -n "${!name}" ] || continue
            { echo "$name<<__END__"; printf '%s\n' "${!name}"; echo "__END__"; } >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
