# cargo-about configuration for packaging/THIRD-PARTY-NOTICES.md; see generate.sh.
# In order of preference, for crates that offer a choice.
accepted = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-2-Clause", "BSD-3-Clause",
  "0BSD", "Zlib", "Unicode-3.0", "IJG", "MPL-2.0", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0",
  "MIT-0", "Unlicense",
]
# The platforms we ship; Windows- and Android-only crates stay out.
targets = [
  "aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-apple-ios",
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
]
# Build dependencies stay in: openssl-src is one, and its OpenSSL ends up in the binary.
ignore-build-dependencies = false
ignore-dev-dependencies = true
# Our own crates are covered by LICENSE.
private = { ignore = true }
